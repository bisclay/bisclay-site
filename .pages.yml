# Konfiguracija za Pages CMS (https://app.pagescms.org)
# Ovo je jedino što CMS čita. Držati usklađeno sa src/content.config.ts.

media:
  input: public/uploads
  output: /uploads
  rename: safe
  categories: [image]

settings:
  content:
    # Ne briši polja koja nisu u shemi (npr. polja koja ja dodam ručno)
    merge: true
  commit:
    identity: user
    templates:
      create: "rad: dodan {filename}"
      update: "rad: izmijenjen {filename}"
      delete: "rad: obrisan {filename}"
      rename: "rad: preimenovan {oldFilename} -> {newFilename}"

content:
  - name: radovi
    label: Radovi
    type: collection
    path: src/content/radovi
    filename:
      template: "{primary}.md"
      field: false
    view:
      fields: [naziv, status, godina, cijena]
      primary: naziv
      sort: [naziv, godina, status]
      search: [naziv, tehnika]
      default:
        sort: naziv
        order: asc
    fields:
      - name: naziv
        label: Naziv rada
        type: string
        required: true
        description: Kako se rad zove na stranici, npr. "Velika vaza s plavom glazurom".

      - name: naslovnica
        label: Glavna fotografija
        type: image
        required: true
        options:
          categories: [image]
          rename: safe
        description: Prva fotografija — prikazuje se u galeriji i na vrhu stranice rada.

      - name: galerija
        label: Ostale fotografije
        type: image
        options:
          multiple:
            max: 12
          unique: true
          categories: [image]
          rename: safe
          extensions: [jpg, jpeg, png, webp]
        description: Dodatne fotografije (detalji, druga strana, rad u prostoru). Nije obavezno.

      - name: status
        label: Status
        type: select
        required: true
        options:
          values:
            - name: dostupno
              label: Dostupno
            - name: rezervirano
              label: Rezervirano
            - name: prodano
              label: Prodano (ostaje u arhivi)
        description: Prodani radovi ostaju vidljivi u arhivi galerije.

      - name: cijena
        label: Cijena (€)
        type: number
        options:
          min: 0
        description: Samo broj, bez znaka €. Ostavi prazno ako je cijena "na upit".

      - name: godina
        label: Godina
        type: number

      - name: tehnika
        label: Tehnika / materijal
        type: string
        description: npr. "kolačarska glina, plava glazura, 1240 °C"

      - name: dimenzije
        label: Dimenzije
        type: string
        description: npr. "visina 24 cm, promjer 12 cm"

      - name: istaknuto
        label: Istakni na naslovnici
        type: boolean
        default: false
        description: Prikazuje se u izboru na početnoj stranici.

      - name: redoslijed
        label: Redoslijed
        type: number
        default: 0
        description: Manji broj = ranije u galeriji. Za većinu radova ostavi 0.

      - name: body
        label: Opis rada
        type: rich-text
        options:
          format: markdown
          media: false

  - name: pocetna
    label: Početna stranica
    type: file
    path: src/data/pocetna.json
    format: json
    fields:
      - name: heroNadnaslov
        label: Natpis iznad naslova
        type: string
        description: Sitni tekst iznad velikog naslova na vrhu.

      - name: heroNaslov
        label: Glavni naslov
        type: string
        required: true
        description: Najveći tekst na stranici. Kratko — 5 do 8 riječi.

      - name: heroTekst
        label: Uvodni tekst
        type: text
        description: Dvije-tri rečenice ispod naslova.

      - name: heroSlika
        label: Velika slika na vrhu (nije obavezno)
        type: image
        options:
          categories: [image]
          rename: safe
        description: >-
          Ako je prazno, prikazuje se fotografija prvog istaknutog rada.
          Postavi samo ako želiš nešto drugo (npr. radionica, ruke u glini).

      - name: gumb1
        label: Gumb 1 (vodi na galeriju)
        type: string
        description: Tekst na glavnom gumbu.

      - name: gumb2
        label: Gumb 2 (vodi na kontakt)
        type: string

      - name: izborNaslov
        label: Naslov izbora radova
        type: string
        description: npr. "Iz radionice"

      - name: izborVeza
        label: Tekst poveznice na galeriju
        type: string
        description: npr. "Svi radovi"

      - name: blok1Naslov
        label: Prvi blok — naslov
        type: string

      - name: blok1Tekst
        label: Prvi blok — tekst
        type: text

      - name: blok1Gumb
        label: Prvi blok — gumb (vodi na O meni)
        type: string

      - name: blok2Naslov
        label: Drugi blok — naslov
        type: string

      - name: blok2Tekst
        label: Drugi blok — tekst
        type: text

      - name: blok2Gumb
        label: Drugi blok — gumb (vodi na kontakt)
        type: string

  - name: stranice
    label: Stranice
    type: collection
    path: src/content/stranice
    filename:
      template: "{primary}.md"
      field: false
    view:
      fields: [naslov]
      primary: naslov
    fields:
      - name: naslov
        label: Naslov
        type: string
        required: true

      - name: podnaslov
        label: Podnaslov
        type: string

      - name: redoslijed
        label: Redoslijed
        type: number
        default: 0

      - name: body
        label: Tekst
        type: rich-text
        options:
          format: markdown
          media: false

  - name: postavke
    label: Postavke stranice
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: naziv
        label: Naziv studija
        type: string
        required: true

      - name: opis
        label: Kratki opis (za Google)
        type: text
        description: Jedna rečenica koja se prikazuje u rezultatima pretrage.

      - name: uloga
        label: Podnaslov / zanimanje
        type: string
        description: npr. "ručno rađena keramika, Zagreb"

      - name: prodaja
        label: Prodaja uključena
        type: boolean
        default: false
        description: >-
          Isključeno = stranica je čisti portfolio: nema cijena, nema gumba za
          kupnju ni narudžbu, nema oznake dostupnosti. Cijene i statusi u
          radovima ostaju sačuvani, samo se ne prikazuju. Uključi kad krene
          prodaja — tada se pojavljuju cijene, značke i gumbi za upit.

      - name: email
        label: E-mail za upite
        type: string
        required: true

      - name: telefon
        label: Telefon
        type: string

      - name: instagram
        label: Instagram (puna poveznica)
        type: string

      - name: lokacija
        label: Lokacija
        type: string

      - name: radionica
        label: Adresa radionice / posjeta po dogovoru
        type: text
